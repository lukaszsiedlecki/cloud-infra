# Syncs Secret Manager values into real k8s Secrets via GKE's Secret Manager
# add-on (cluster must be created with --enable-secret-sync, see
# opentofu/gke/modules/gke-autopilot). One SecretProviderClass/SecretSync
# pair per app, each using that app's own KSA, since the underlying IAM
# bindings (opentofu/gke/modules/secrets) grant each KSA access only to its
# own two secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shortliner-db-secrets
  namespace: shortliner
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shortliner-prod/secrets/shortliner-db-user/versions/latest"
        path: "SHORTLINER_DB_USER.txt"
      - resourceName: "projects/shortliner-prod/secrets/shortliner-db-password/versions/latest"
        path: "SHORTLINER_DB_PASSWORD.txt"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: shortliner-db-secret
  namespace: shortliner
spec:
  serviceAccountName: shortliner
  secretProviderClassName: shortliner-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "SHORTLINER_DB_USER.txt"
        targetKey: "SHORTLINER_DB_USER"
      - sourcePath: "SHORTLINER_DB_PASSWORD.txt"
        targetKey: "SHORTLINER_DB_PASSWORD"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shortliner-analytics-db-secrets
  namespace: shortliner
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shortliner-prod/secrets/analytics-db-user/versions/latest"
        path: "ANALYTICS_DB_USER.txt"
      - resourceName: "projects/shortliner-prod/secrets/analytics-db-password/versions/latest"
        path: "ANALYTICS_DB_PASSWORD.txt"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: shortliner-analytics-db-secret
  namespace: shortliner
spec:
  serviceAccountName: shortliner-analytics
  secretProviderClassName: shortliner-analytics-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "ANALYTICS_DB_USER.txt"
        targetKey: "ANALYTICS_DB_USER"
      - sourcePath: "ANALYTICS_DB_PASSWORD.txt"
        targetKey: "ANALYTICS_DB_PASSWORD"
