# Syncs Secret Manager values into real k8s Secrets via GKE's Secret Sync
# feature (cluster's secret_sync_config, see opentofu/gke/modules/gke). One
# SecretProviderClass/SecretSync pair per app, each using that app's own KSA,
# since the underlying IAM bindings (opentofu/gke/modules/secrets) grant each
# KSA access only to its own secrets. DB_HOST is included here (sourced from
# Cloud SQL's live private_ip_address via Terraform) rather than hardcoded in
# the Deployment manifests — that IP isn't stable across instance recreates.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shortliner-db-secrets
  namespace: shortliner
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shortliner-prod/secrets/shortliner-db-user/versions/latest"
        path: "SHORTLINER_DB_USER.txt"
      - resourceName: "projects/shortliner-prod/secrets/shortliner-db-password/versions/latest"
        path: "SHORTLINER_DB_PASSWORD.txt"
      - resourceName: "projects/shortliner-prod/secrets/shortliner-db-host/versions/latest"
        path: "SHORTLINER_DB_HOST.txt"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: shortliner-db-secret
  namespace: shortliner
spec:
  serviceAccountName: shortliner
  secretProviderClassName: shortliner-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "SHORTLINER_DB_USER.txt"
        targetKey: "SHORTLINER_DB_USER"
      - sourcePath: "SHORTLINER_DB_PASSWORD.txt"
        targetKey: "SHORTLINER_DB_PASSWORD"
      - sourcePath: "SHORTLINER_DB_HOST.txt"
        targetKey: "SHORTLINER_DB_HOST"
---
