apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortliner-analytics
  namespace: shortliner
  labels:
    app: shortliner-analytics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shortliner-analytics
  template:
    metadata:
      labels:
        app: shortliner-analytics
    spec:
      serviceAccountName: shortliner-analytics
      # Spot Pods for cost savings — safe here since this is stateless and
      # tolerates a restart on preemption.
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: shortliner-analytics
          # Patched by the promotion workflow — never rebuilt for prod.
          image: ghcr.io/lukaszsiedlecki/shortliner-analytics:sha-380d66b
          ports:
            - containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            - name: DB_HOST
              value: "10.158.0.3"
            - name: DB_NAME
              value: "shortliner_analytics"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shortliner-analytics-db-secret
                  key: ANALYTICS_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortliner-analytics-db-secret
                  key: ANALYTICS_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
