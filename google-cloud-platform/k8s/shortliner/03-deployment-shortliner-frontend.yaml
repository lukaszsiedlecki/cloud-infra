apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortliner-frontend
  namespace: shortliner
  labels:
    app: shortliner-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shortliner-frontend
  template:
    metadata:
      labels:
        app: shortliner-frontend
    spec:
      serviceAccountName: shortliner-frontend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: shortliner-frontend
          # Patched by the promotion workflow — never rebuilt for prod.
          image: ghcr.io/lukaszsiedlecki/shortliner-frontend:sha-0000000
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          env:
            - name: SHORTLINER_BACKEND_URL
              value: "http://shortliner-svc:8080"
            - name: ANALYTICS_BACKEND_URL
              value: "http://shortliner-analytics-svc:8082"
          # homelab uses 300m/256Mi limits, but GKE Autopilot's general-purpose
          # compute class enforces a 1-6.5 GiB-per-vCPU ratio; 256Mi at 300m
          # falls below that floor and would be silently rewritten at apply
          # time. Bumped to 384Mi to stay inside the ratio.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
