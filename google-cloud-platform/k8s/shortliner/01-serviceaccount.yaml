# One KSA per app. No iam.gke.io/gcp-service-account annotation needed —
# Secret Manager access is granted via a direct Workload Identity Federation
# principal binding on the KSA itself (see opentofu/gke/modules/secrets),
# not through a separate Google service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shortliner
  namespace: shortliner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shortliner-analytics
  namespace: shortliner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shortliner-frontend
  namespace: shortliner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: shortliner
